services:
  # Backend API & Unified Flutter Web Application
  - type: web
    name: smart-water-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_ai.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: THINGSPEAK_CHANNEL_ID
        value: 3487158
      - key: THINGSPEAK_READ_API_KEY
        value: ""

  # Dedicated High-Speed CDN Static Site for Flutter Web Frontend
  - type: static
    name: smart-water-monitor-web
    staticPublishPath: ./build/web
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
