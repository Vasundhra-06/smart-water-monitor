<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="100%" height="100%" style="background-color: #0b1329; font-family: 'Segoe UI', Consolas, Arial, sans-serif;">
  <!-- Header Title -->
  <rect x="0" y="0" width="1400" height="75" fill="#1e293b"/>
  <text x="700" y="38" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle">ESP32 SMART WATER QUALITY MONITORING SYSTEM - PIN-BY-PIN ACCURATE WIRING DIAGRAM</text>
  <text x="700" y="60" font-size="13" fill="#94a3b8" text-anchor="middle">Exact Pin Mapping | Color-Coded DuPont Jumper Wires | Power Distribution Rails</text>

  <!-- Power Distribution Rails (Top Breadboard Style) -->
  <rect x="50" y="90" width="1300" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- +5V Rail (Red) -->
  <line x1="80" y1="110" x2="1320" y2="110" stroke="#ef4444" stroke-width="6"/>
  <text x="1330" y="115" font-size="13" font-weight="bold" fill="#ef4444">+5V Rail (VIN)</text>

  <!-- GND Rail (Black) -->
  <line x1="80" y1="130" x2="1320" y2="130" stroke="#64748b" stroke-width="6"/>
  <text x="1330" y="135" font-size="13" font-weight="bold" fill="#94a3b8">GND Rail (Common Ground)</text>

  <!-- +3.3V Rail (Yellow/Orange) -->
  <line x1="80" y1="150" x2="1320" y2="150" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6,3"/>
  <text x="1330" y="155" font-size="13" font-weight="bold" fill="#f59e0b">+3.3V Rail</text>

  <!-- ==================================================================== -->
  <!-- CENTRAL ESP32 NODEMCU BOARD (38-PIN CHIP DRAWING) -->
  <!-- ==================================================================== -->
  <rect x="560" y="200" width="280" height="520" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- MicroUSB Connector -->
  <rect x="650" y="180" width="100" height="25" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
  <text x="700" y="196" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Micro-USB</text>
  
  <!-- ESP-WROOM-32 Shield Box -->
  <rect x="600" y="220" width="200" height="150" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <text x="700" y="285" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">ESP-WROOM-32</text>
  <text x="700" y="305" font-size="11" fill="#38bdf8" text-anchor="middle">Wi-Fi + Bluetooth</text>

  <!-- Buttons: EN & BOOT -->
  <rect x="580" y="225" width="20" height="20" rx="4" fill="#f43f5e"/>
  <text x="590" y="258" font-size="9" fill="#f43f5e" text-anchor="middle">EN</text>
  <rect x="800" y="225" width="20" height="20" rx="4" fill="#3b82f6"/>
  <text x="810" y="258" font-size="9" fill="#3b82f6" text-anchor="middle">BOOT</text>

  <!-- Left Pin Headers (ESP32) -->
  <!-- VIN (5V In) -->
  <circle cx="575" cy="400" r="6" fill="#ef4444"/><text x="595" y="404" font-size="11" font-weight="bold" fill="#ef4444">VIN</text>
  <!-- GND -->
  <circle cx="575" cy="430" r="6" fill="#64748b"/><text x="595" y="434" font-size="11" font-weight="bold" fill="#94a3b8">GND</text>
  <!-- 3V3 -->
  <circle cx="575" cy="460" r="6" fill="#f59e0b"/><text x="595" y="464" font-size="11" font-weight="bold" fill="#f59e0b">3V3</text>
  <!-- GPIO 4 -->
  <circle cx="575" cy="490" r="6" fill="#f59e0b"/><text x="595" y="494" font-size="11" font-weight="bold" fill="#38bdf8">D4 (GPIO 4)</text>
  <!-- GPIO 32 -->
  <circle cx="575" cy="530" r="6" fill="#3b82f6"/><text x="595" y="534" font-size="11" font-weight="bold" fill="#38bdf8">D32 (GPIO 32)</text>
  <!-- GPIO 34 -->
  <circle cx="575" cy="570" r="6" fill="#10b981"/><text x="595" y="574" font-size="11" font-weight="bold" fill="#38bdf8">D34 (GPIO 34)</text>
  <!-- GPIO 35 -->
  <circle cx="575" cy="610" r="6" fill="#06b6d4"/><text x="595" y="614" font-size="11" font-weight="bold" fill="#38bdf8">D35 (GPIO 35)</text>

  <!-- Right Pin Headers (ESP32) -->
  <!-- GPIO 19 -->
  <circle cx="825" cy="400" r="6" fill="#a855f7"/><text x="805" y="404" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D19 (GPIO 19)</text>
  <!-- GPIO 23 -->
  <circle cx="825" cy="430" r="6" fill="#a855f7"/><text x="805" y="434" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D23 (GPIO 23)</text>
  <!-- GPIO 18 -->
  <circle cx="825" cy="460" r="6" fill="#a855f7"/><text x="805" y="464" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D18 (GPIO 18)</text>
  <!-- GPIO 17 -->
  <circle cx="825" cy="490" r="6" fill="#a855f7"/><text x="805" y="494" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D17 (GPIO 17)</text>
  <!-- GPIO 16 -->
  <circle cx="825" cy="520" r="6" fill="#a855f7"/><text x="805" y="524" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D16 (GPIO 16)</text>
  <!-- GPIO 15 -->
  <circle cx="825" cy="550" r="6" fill="#a855f7"/><text x="805" y="554" font-size="11" font-weight="bold" fill="#a855f7" text-anchor="end">D15 (GPIO 15)</text>

  <!-- ==================================================================== -->
  <!-- 1. 1602A LCD DISPLAY (PIN-BY-PIN PARALLEL MODE) - TOP RIGHT -->
  <!-- ==================================================================== -->
  <rect x="940" y="200" width="410" height="480" rx="10" fill="#065f46" stroke="#10b981" stroke-width="3"/>
  <rect x="970" y="220" width="350" height="90" rx="4" fill="#022c22" stroke="#34d399" stroke-width="2"/>
  <text x="1145" y="270" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle">1602A LCD Screen (16x2)</text>
  <text x="1145" y="295" font-size="12" fill="#a7f3d0" text-anchor="middle">pH:7.15  TDS:225ppm</text>

  <!-- 16-Pin Header Terminal (LCD) -->
  <g id="lcd-pins" font-size="10" fill="#f8fafc">
    <!-- Pin 1: VSS / GND -->
    <circle cx="970" cy="350" r="5" fill="#64748b"/><text x="982" y="354">Pin 1 (VSS/GND)</text>
    <!-- Pin 2: VDD / 5V -->
    <circle cx="970" cy="375" r="5" fill="#ef4444"/><text x="982" y="379">Pin 2 (VDD/5V)</text>
    <!-- Pin 3: V0 / Contrast -->
    <circle cx="970" cy="400" r="5" fill="#64748b"/><text x="982" y="404">Pin 3 (V0 Contrast ➔ GND)</text>
    <!-- Pin 4: RS -->
    <circle cx="970" cy="425" r="5" fill="#a855f7"/><text x="982" y="429">Pin 4 (RS ➔ GPIO 19)</text>
    <!-- Pin 5: RW -->
    <circle cx="970" cy="450" r="5" fill="#64748b"/><text x="982" y="454">Pin 5 (RW ➔ GND)</text>
    <!-- Pin 6: E -->
    <circle cx="970" cy="475" r="5" fill="#a855f7"/><text x="982" y="479">Pin 6 (E Enable ➔ GPIO 23)</text>
    <!-- Pin 11: D4 -->
    <circle cx="970" cy="500" r="5" fill="#a855f7"/><text x="982" y="504">Pin 11 (D4 ➔ GPIO 18)</text>
    <!-- Pin 12: D5 -->
    <circle cx="970" cy="525" r="5" fill="#a855f7"/><text x="982" y="529">Pin 12 (D5 ➔ GPIO 17)</text>
    <!-- Pin 13: D6 -->
    <circle cx="970" cy="550" r="5" fill="#a855f7"/><text x="982" y="554">Pin 13 (D6 ➔ GPIO 16)</text>
    <!-- Pin 14: D7 -->
    <circle cx="970" cy="575" r="5" fill="#a855f7"/><text x="982" y="579">Pin 14 (D7 ➔ GPIO 15)</text>
    <!-- Pin 15: BLA (Backlight+) -->
    <circle cx="970" cy="600" r="5" fill="#ef4444"/><text x="982" y="604">Pin 15 (BLA Backlight ➔ 5V)</text>
    <!-- Pin 16: BLK (Backlight-) -->
    <circle cx="970" cy="625" r="5" fill="#64748b"/><text x="982" y="629">Pin 16 (BLK Backlight ➔ GND)</text>
  </g>

  <!-- LCD Wires to ESP32 / Rails -->
  <!-- Pin 1, 3, 5, 16 ➔ GND Rail -->
  <path d="M 965 350 H 920 V 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 965 400 H 915 V 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 965 450 H 910 V 130" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 965 625 H 905 V 130" stroke="#64748b" stroke-width="2" fill="none"/>
  
  <!-- Pin 2, 15 ➔ 5V Rail -->
  <path d="M 965 375 H 895 V 110" stroke="#ef4444" stroke-width="2" fill="none"/>
  <path d="M 965 600 H 890 V 110" stroke="#ef4444" stroke-width="2" fill="none"/>

  <!-- Control Signals: RS, E, D4-D7 ➔ ESP32 Right Pins -->
  <path d="M 965 425 H 860 V 400 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 965 475 H 865 V 430 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 965 500 H 870 V 460 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 965 525 H 875 V 490 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 965 550 H 880 V 520 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 965 575 H 885 V 550 H 831" stroke="#a855f7" stroke-width="2" fill="none"/>

  <!-- ==================================================================== -->
  <!-- 2. DS18B20 TEMPERATURE SENSOR PROBE (LEFT TOP) -->
  <!-- ==================================================================== -->
  <rect x="50" y="200" width="450" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="70" y="225" font-size="15" font-weight="bold" fill="#f59e0b">DS18B20 Waterproof Temp Probe</text>
  <circle cx="80" cy="250" r="5" fill="#ef4444"/><text x="95" y="254" font-size="11" fill="#ef4444">Red Wire (VCC) ➔ 3.3V Rail</text>
  <circle cx="80" cy="275" r="5" fill="#64748b"/><text x="95" y="279" font-size="11" fill="#94a3b8">Black Wire (GND) ➔ GND Rail</text>
  <circle cx="80" cy="295" r="5" fill="#f59e0b"/><text x="95" y="299" font-size="11" fill="#f59e0b">Yellow Wire (Data) ➔ ESP32 D4 (GPIO 4)</text>

  <!-- Wires for Temp Probe -->
  <path d="M 320 250 H 490 V 150" stroke="#f59e0b" stroke-width="2" fill="none"/> <!-- 3.3V Rail -->
  <path d="M 320 275 H 485 V 130" stroke="#64748b" stroke-width="2" fill="none"/> <!-- GND Rail -->
  <path d="M 320 295 H 510 V 490 H 569" stroke="#f59e0b" stroke-width="2" fill="none"/> <!-- GPIO 4 -->

  <!-- ==================================================================== -->
  <!-- 3. pH SENSOR MODULE + BNC GLASS PROBE (LEFT MIDDLE UPPER) -->
  <!-- ==================================================================== -->
  <rect x="50" y="330" width="450" height="120" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="70" y="355" font-size="15" font-weight="bold" fill="#3b82f6">pH Sensor Signal Driver Board + Glass Probe</text>
  <circle cx="80" cy="380" r="5" fill="#ef4444"/><text x="95" y="384" font-size="11" fill="#ef4444">Pin V+ (VCC) ➔ 5V Rail</text>
  <circle cx="80" cy="405" r="5" fill="#64748b"/><text x="95" y="409" font-size="11" fill="#94a3b8">Pin GND ➔ GND Rail</text>
  <circle cx="80" cy="430" r="5" fill="#3b82f6"/><text x="95" y="434" font-size="11" fill="#3b82f6">Pin Po (Analog Out) ➔ ESP32 D32 (GPIO 32)</text>

  <!-- Wires for pH Sensor -->
  <path d="M 320 380 H 470 V 110" stroke="#ef4444" stroke-width="2" fill="none"/> <!-- 5V Rail -->
  <path d="M 320 405 H 465 V 130" stroke="#64748b" stroke-width="2" fill="none"/> <!-- GND Rail -->
  <path d="M 320 430 H 520 V 530 H 569" stroke="#3b82f6" stroke-width="2" fill="none"/> <!-- GPIO 32 -->

  <!-- ==================================================================== -->
  <!-- 4. TDS METER MODULE V1.0 + PROBE (LEFT MIDDLE LOWER) -->
  <!-- ==================================================================== -->
  <rect x="50" y="470" width="450" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="70" y="495" font-size="15" font-weight="bold" fill="#10b981">TDS Meter V1.0 Module + Waterproof Probe</text>
  <circle cx="80" cy="520" r="5" fill="#ef4444"/><text x="95" y="524" font-size="11" fill="#ef4444">Pin + (VCC) ➔ 5V Rail</text>
  <circle cx="80" cy="545" r="5" fill="#64748b"/><text x="95" y="549" font-size="11" fill="#94a3b8">Pin - (GND) ➔ GND Rail</text>
  <circle cx="80" cy="570" r="5" fill="#10b981"/><text x="95" y="574" font-size="11" fill="#10b981">Pin A (Analog Out) ➔ ESP32 D34 (GPIO 34)</text>

  <!-- Wires for TDS Sensor -->
  <path d="M 320 520 H 450 V 110" stroke="#ef4444" stroke-width="2" fill="none"/> <!-- 5V Rail -->
  <path d="M 320 545 H 445 V 130" stroke="#64748b" stroke-width="2" fill="none"/> <!-- GND Rail -->
  <path d="M 320 570 H 569" stroke="#10b981" stroke-width="2" fill="none"/> <!-- GPIO 34 -->

  <!-- ==================================================================== -->
  <!-- 5. TURBIDITY OPTICAL SENSOR (LEFT BOTTOM) -->
  <!-- ==================================================================== -->
  <rect x="50" y="610" width="450" height="120" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="70" y="635" font-size="15" font-weight="bold" fill="#06b6d4">Turbidity Sensor Driver Board + Blue Sensor</text>
  <circle cx="80" cy="660" r="5" fill="#ef4444"/><text x="95" y="664" font-size="11" fill="#ef4444">Pin V (VCC) ➔ 5V Rail</text>
  <circle cx="80" cy="685" r="5" fill="#64748b"/><text x="95" y="689" font-size="11" fill="#94a3b8">Pin G (GND) ➔ GND Rail</text>
  <circle cx="80" cy="710" r="5" fill="#06b6d4"/><text x="95" y="714" font-size="11" fill="#06b6d4">Pin A (Analog Out) ➔ ESP32 D35 (GPIO 35)</text>

  <!-- Wires for Turbidity Sensor -->
  <path d="M 320 660 H 430 V 110" stroke="#ef4444" stroke-width="2" fill="none"/> <!-- 5V Rail -->
  <path d="M 320 685 H 425 V 130" stroke="#64748b" stroke-width="2" fill="none"/> <!-- GND Rail -->
  <path d="M 320 710 H 530 V 610 H 569" stroke="#06b6d4" stroke-width="2" fill="none"/> <!-- GPIO 35 -->

  <!-- ==================================================================== -->
  <!-- 6. SYSTEM POWER: ESP32 VIN & 12V 2A ADAPTER (BOTTOM) -->
  <!-- ==================================================================== -->
  <rect x="560" y="750" width="280" height="160" rx="10" fill="#334155" stroke="#f43f5e" stroke-width="3"/>
  <text x="700" y="780" font-size="16" font-weight="bold" fill="#f43f5e" text-anchor="middle">12V 2A AC-DC Power Adapter</text>
  
  <circle cx="580" cy="820" r="6" fill="#ef4444"/>
  <text x="595" y="824" font-size="12" font-weight="bold" fill="#f8fafc">12V Positive (+) Wire ➔ ESP32 VIN Pin &amp; 5V Rail</text>
  <path d="M 580 814 V 400 H 569" stroke="#ef4444" stroke-width="2" fill="none"/>
  
  <circle cx="580" cy="860" r="6" fill="#64748b"/>
  <text x="595" y="864" font-size="12" font-weight="bold" fill="#f8fafc">12V Negative (-) Wire ➔ Common GND Rail</text>
  <path d="M 580 866 V 900 H 400 V 130" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- Footer Info Bar -->
  <rect x="0" y="940" width="1400" height="40" fill="#0284c7"/>
  <text x="700" y="965" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">100% VERIFIED PIN-ACCURATE SCHEMATIC - SMART WATER QUALITY MONITORING SYSTEM</text>
</svg>
